function AnimatedNumber({ value, decimals = 0 }) {
  const [disp, setDisp] = useState(value);
  const prev = useRef(value);
  useEffect(() => {
    const start = prev.current, end = value, t0 = performance.now();
    const step = now => {
      const t = Math.min((now - t0) / 400, 1);
      const e = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      setDisp(start + (end - start) * e);
      if (t < 1) requestAnimationFrame(step);
      else prev.current = end;
    };
    requestAnimationFrame(step);
  }, [value]);
  return <>{disp.toFixed(decimals)}</>;
}

// ─── INDICATOR MONITOR COMPONENT ─────────────────────────────────────────────

function IndicatorMonitor({ sans, lora }) {
  const [openDim, setOpenDim] = useState(null);

  return (
    <div style={{ maxWidth: 880, margin: "0 auto", padding: "48px 24px 64px" }}>
      <div style={{ marginBottom: 40, maxWidth: 660 }}>
        <h1 style={{ ...lora, fontSize: "clamp(22px, 3.5vw, 32px)", fontWeight: 600, color: "#1B3A6B", lineHeight: 1.2, marginBottom: 14 }}>
          Leading Indicator Monitor
        </h1>
        <p style={{ fontSize: 15, color: "#444", lineHeight: 1.8 }}>
          The impact assessment sets your strategic posture. This monitor tracks the specific, observable signals that indicate each disruption dimension is accelerating. Review quarterly; escalate to governance on any indicator reaching the red threshold.

        <p style={{ ...lora, fontStyle: "italic", fontSize: 14, color: "#888", lineHeight: 1.7, marginTop: 10 }}>
          Amber thresholds are early-warning triggers — investigate and brief leadership. Red thresholds require immediate escalation and a governance response. Track at least two leading indicators per dimension.
        </p>
      </div>

      {/* Legend */}
      <div style={{ display: "flex", gap: 20, marginBottom: 28, flexWrap: "wrap" }}>
        {[
          { color: "#CA8A04", bg: "#FEFCE8", border: "#F0E4A0", label: "Amber — Monitor & Brief" },
          { color: "#C0392B", bg: "#FDF0EE", border: "#E8C4BF", label: "Red — Escalate to Governance" },
        ].map(t => (
          <div key={t.label} style={{ display: "flex", alignItems: "center", gap: 8, background: t.bg, border: `1px solid ${t.border}`, borderRadius: 4, padding: "6px 12px" }}>
            <div style={{ width: 12, height: 12, borderRadius: "50%", background: t.color, flexShrink: 0 }} />
            <span style={{ fontSize: 12, fontWeight: 600, color: t.color }}>{t.label}</span>
          </div>
        ))}
      </div>

      {/* Dimensions */}
      {INDICATORS.map((dim, di) => {
        const isOpen = openDim === di;
        return (
          <div key={di} style={{ background: "#FFFFFF", border: `1px solid ${isOpen ? dim.color + "55" : "#E8E4DC"}`, borderLeft: `4px solid ${dim.color}`, borderRadius: 6, marginBottom: 12, overflow: "hidden" }}>
            <div style={{ padding: "16px 20px", cursor: "pointer", userSelect: "none", display: "flex", justifyContent: "space-between", alignItems: "center" }}

              <div>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", color: dim.color, textTransform: "uppercase", marginBottom: 3 }}>

                <span style={{ fontSize: 10, color: "#BBB" }}>{isOpen ? "▲" : "▼"}</span>
              </div>
            </div>

            {isOpen && (
              <div style={{ borderTop: "1px solid #F0EDE8" }}>
                {/* Table header */}
                <div style={{ display: "grid", gridTemplateColumns: "2.5fr 1fr 1fr 1.5fr 1.5fr", gap: 0, background: "#F7F4EF", padding: "8px 20px", borderBottom: "1px solid #E8E4DC" }}>

                  ))}
                </div>

        Community Banking Disruption Assessment · 2026 · Free to share and adapt
      </div>
    </div>
  );
}

  const [values, setValues] = useState(Object.fromEntries(QUESTIONS.map(q => [q.id, q.default])));
  const [expanded, setExpanded] = useState(null);
  const [activeTab, setActiveTab] = useState("assessment");

  const score = QUESTIONS.reduce((acc, q) => acc + (values[q.id] / 100) * q.weight, 0);
  const scorePct = Math.round((score / WEIGHT_TOTAL) * 100);
  const level = getLevel(scorePct);

  const sans = { fontFamily: "'Source Sans 3', sans-serif" };
  const lora = { fontFamily: "'Lora', Georgia, serif" };

  const scenarios = [
    { label: "Reset to base case", vals: Object.fromEntries(QUESTIONS.map(q => [q.id, q.default])) },
    { label: "Optimistic",         vals: Object.fromEntries(QUESTIONS.map(q => [q.id, Math.max(10, q.default - 25)])) },
    { label: "Stress case",        vals: Object.fromEntries(QUESTIONS.map(q => [q.id, Math.min(95, q.default + 15)])) },
    { label: "All at midpoint",    vals: Object.fromEntries(QUESTIONS.map(q => [q.id, 50])) },
  ];

  return (
    <div style={{ ...sans, background: "#F7F4EF", minHeight: "100vh", color: "#1A1A1A" }}>

      {/* HEADER */}
      <div style={{ background: "#1B3A6B", padding: "14px 24px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
        <div style={{ color: "#FFFFFF", fontWeight: 700, fontSize: 15, letterSpacing: "0.06em" }}>COMMUNITY BANKING DISRUPTION ASSESSMENT</div>
        <div style={{ color: "rgba(255,255,255,0.4)", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase" }}>Interactive Framework · 2026</div>
      </div>

      {/* TABS */}
      <div style={{ background: "#FFFFFF", borderBottom: "2px solid #E8E4DC", position: "sticky", top: 0, zIndex: 50 }}>
        <div style={{ maxWidth: 880, margin: "0 auto", padding: "0 24px", display: "flex", gap: 0 }}>
          {[
            { id: "assessment", label: "Impact Assessment", sub: "Set your assumptions" },
            { id: "indicators", label: "Leading Indicators", sub: "What to watch quarterly" },
          ].map(tab => (
            <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
              background: "transparent", border: "none", padding: "14px 24px 12px",
              cursor: "pointer", borderBottom: `3px solid ${activeTab === tab.id ? "#1B3A6B" : "transparent"}`,
              marginBottom: -2, transition: "all 0.15s", textAlign: "left",
            }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: activeTab === tab.id ? "#1B3A6B" : "#888", letterSpacing: "0.02em" }}>{tab.label}</div>
              <div style={{ fontSize: 10, color: activeTab === tab.id ? "#4A6FA5" : "#BBB", marginTop: 1 }}>{tab.sub}</div>
            </button>
          ))}
        </div>
      </div>

      {/* TAB CONTENT */}
      {activeTab === "indicators" ? (
        <IndicatorMonitor sans={sans} lora={lora} />
      ) : (
      <div style={{ maxWidth: 880, margin: "0 auto", padding: "48px 24px 64px" }}>

        <div style={{ marginBottom: 48, maxWidth: 660 }}>
          <h1 style={{ ...lora, fontSize: "clamp(26px, 4vw, 36px)", fontWeight: 600, color: "#1B3A6B", lineHeight: 1.2, marginBottom: 16 }}>
            What disruption is your bank actually planning for?
          </h1>
          <p style={{ fontSize: 16, color: "#444", lineHeight: 1.8 }}>
            Eight forces are reshaping community banking. They all exist, but how severely they will hit an institution like yours, in a market like yours, over the next decade. Set each slider to reflect your honest judgment. The output connects your assumptions directly to what a bank needs to do about them.
          </p>
          <p style={{ ...lora, fontStyle: "italic", fontSize: 15, color: "#888", lineHeight: 1.7, marginTop: 12 }}>
            The final score is interesting but greater value will come from establishing a dialogue about risks that are largely over the horizon but fast approaching.
          </p>
        </div>

        {QUESTIONS.map((q, qi) => {
          const val = values[q.id];
          const isOpen = expanded === q.id;
          let feelLabel, feelColor;
          if      (val >= 80) { feelLabel = "Severe impact expected";     feelColor = "#C0392B"; }
          else if (val >= 60) { feelLabel = "Significant impact";          feelColor = "#D35400"; }
          else if (val >= 40) { feelLabel = "Moderate — monitor closely";  feelColor = "#CA8A04"; }
          else if (val >= 20) { feelLabel = "Limited impact";              feelColor = "#16A34A"; }
          else                { feelLabel = "Minimal impact";              feelColor = "#16A34A"; }

          return (
            <div key={q.id} style={{ background: "#FFFFFF", border: `1px solid ${isOpen ? q.color + "55" : "#E8E4DC"}`, borderLeft: `4px solid ${q.color}`, borderRadius: 6, marginBottom: 14, transition: "border-color 0.2s" }}>
              <div style={{ padding: "20px 24px", cursor: "pointer", userSelect: "none" }} onClick={() => setExpanded(isOpen ? null : q.id)}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 16 }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", color: q.color, textTransform: "uppercase", marginBottom: 5 }}>
                      {qi + 1} of {QUESTIONS.length} &nbsp;·&nbsp; {q.heading}
                    </div>
                    <div style={{ fontSize: 16, fontWeight: 600, color: "#1A1A1A", lineHeight: 1.4 }}>{q.question}</div>
                  </div>
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: feelColor, whiteSpace: "nowrap" }}>{feelLabel}</div>
                    <div style={{ fontSize: 10, color: "#BBB", marginTop: 2 }}>{isOpen ? "▲ collapse" : "▼ expand"}</div>
                  </div>
                </div>
                <div style={{ marginTop: 16 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                    <span style={{ fontSize: 11, color: "#999", maxWidth: "42%", lineHeight: 1.35 }}>{q.lowLabel}</span>
                    <span style={{ fontSize: 11, color: "#999", maxWidth: "42%", lineHeight: 1.35, textAlign: "right" }}>{q.highLabel}</span>
                  </div>
                  <div style={{ position: "relative", height: 10, borderRadius: 5, background: "#EEE" }}>
                    <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: `${val}%`, borderRadius: 5, background: `linear-gradient(90deg, ${q.color}55, ${q.color})`, transition: "width 0.08s ease" }} />
                    <div style={{ position: "absolute", top: "50%", left: `${val}%`, transform: "translate(-50%, -50%)", width: 20, height: 20, borderRadius: "50%", background: "#FFFFFF", border: `3px solid ${q.color}`, boxShadow: "0 1px 4px rgba(0,0,0,0.15)", transition: "left 0.08s ease", pointerEvents: "none" }} />
                    <input type="range" min={0} max={100} value={val}
                      onChange={e => setValues(prev => ({ ...prev, [q.id]: parseInt(e.target.value) }))}
                      onClick={e => e.stopPropagation()}
                      style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, cursor: "pointer", margin: 0, zIndex: 2 }}
                    />
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5 }}>
                    {["Minimal","","Moderate","","Severe"].map((lbl, i) => (
                      <span key={i} style={{ fontSize: 9, letterSpacing: "0.04em", color: i * 25 <= val ? q.color + "AA" : "#CCC", fontWeight: i * 25 <= val ? 600 : 400, transition: "color 0.2s", textAlign: i === 4 ? "right" : i === 2 ? "center" : "left" }}>{lbl}</span>
                    ))}
                  </div>
                </div>
              </div>

              {isOpen && (
                <div style={{ borderTop: "1px solid #F0EDE8", padding: "0 24px 24px" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 16 }} className="two-col">
                    <div style={{ background: "#F7FBF7", border: "1px solid #C6E6C6", borderRadius: 4, padding: "14px 16px" }}>
                      <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", color: "#16A34A", textTransform: "uppercase", marginBottom: 7 }}>← If the impact is limited</div>
                      <p style={{ fontSize: 13, color: "#444", lineHeight: 1.7 }}>{q.low}</p>
                    </div>
                    <div style={{ background: "#FEF8F7", border: "1px solid #F0C4BC", borderRadius: 4, padding: "14px 16px" }}>
                      <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", color: "#C0392B", textTransform: "uppercase", marginBottom: 7 }}>If the impact is severe →</div>
                      <p style={{ fontSize: 13, color: "#444", lineHeight: 1.7 }}>{q.high}</p>
                    </div>
                  </div>
                  <div style={{ marginTop: 12, background: "#F4F6FA", border: "1px solid #D8DFEA", borderLeft: "3px solid #1B3A6B", borderRadius: 4, padding: "12px 16px" }}>
                    <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", color: "#1B3A6B", textTransform: "uppercase", marginBottom: 5 }}>Banking context</div>
                    <p style={{ fontSize: 13, color: "#4A5568", lineHeight: 1.7 }}>{q.banking_note}</p>
                  </div>
                </div>
              )}
            </div>
          );
        })}

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", margin: "8px 0 40px" }}>
          {scenarios.map(s => (
            <button key={s.label} onClick={() => setValues(s.vals)} style={{ background: "#FFFFFF", border: "1px solid #D8D4CC", color: "#666", ...sans, fontSize: 12, padding: "7px 16px", borderRadius: 4, cursor: "pointer", transition: "all 0.15s" }}
              onMouseEnter={e => { e.target.style.borderColor = "#1B3A6B"; e.target.style.color = "#1B3A6B"; }}
              onMouseLeave={e => { e.target.style.borderColor = "#D8D4CC"; e.target.style.color = "#666"; }}
            >{s.label}</button>
          ))}
        </div>

        <div style={{ background: level.bg, border: `2px solid ${level.border}`, borderRadius: 8, padding: "36px", marginBottom: 36, transition: "all 0.4s ease" }}>
          <div style={{ display: "grid", gridTemplateColumns: "160px 1fr", gap: 36, alignItems: "start", marginBottom: 28 }} className="output-grid">
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.12em", color: level.color, textTransform: "uppercase", marginBottom: 4 }}>Impact Score</div>
              <div style={{ fontSize: 76, fontWeight: 700, color: level.color, lineHeight: 1, transition: "color 0.4s" }}>
                <AnimatedNumber value={scorePct} />
              </div>
              <div style={{ fontSize: 12, color: "#999", marginTop: 2 }}>out of 100</div>
              <div style={{ marginTop: 14 }}>
                <div style={{ height: 10, borderRadius: 5, background: "#E0DBD5", position: "relative", overflow: "hidden" }}>
                  <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: `${scorePct}%`, background: "linear-gradient(90deg, #16A34A, #CA8A04, #D35400, #C0392B)", borderRadius: 5, transition: "width 0.4s ease" }} />
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5 }}>
                  <span style={{ fontSize: 9, color: "#BBB" }}>Limited</span>
                  <span style={{ fontSize: 9, color: "#BBB" }}>Severe</span>
                </div>
              </div>
            </div>
            <div>
              <h2 style={{ ...lora, fontSize: 19, fontWeight: 600, color: level.color, lineHeight: 1.35, marginBottom: 12 }}>{level.label}</h2>
              <p style={{ fontSize: 15, color: "#333", lineHeight: 1.8, marginBottom: 10 }}>{level.summary}</p>
              <div style={{ fontSize: 13, fontWeight: 700, color: level.color, letterSpacing: "0.04em" }}>{level.urgency}</div>
            </div>
          </div>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", color: "#888", textTransform: "uppercase", marginBottom: 14 }}>Strategic implications at this assessment level</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }} className="two-col">
              {level.actions.map((a, i) => (
                <div key={i} style={{ background: "rgba(255,255,255,0.72)", border: "1px solid rgba(0,0,0,0.07)", borderRadius: 5, padding: "14px 16px" }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#1B3A6B", marginBottom: 6 }}>{a.title}</div>
                  <div style={{ fontSize: 13, color: "#555", lineHeight: 1.65 }}>{a.body}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div style={{ background: "#FFFFFF", border: "1px solid #E8E4DC", borderRadius: 6, padding: "24px", marginBottom: 36 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", color: "#888", textTransform: "uppercase", marginBottom: 18 }}>Where the impact is concentrated</div>
          {[...QUESTIONS].sort((a, b) => (values[b.id] / 100) * b.weight - (values[a.id] / 100) * a.weight).map(q => {
            const contribution = (values[q.id] / 100) * q.weight;
            const barPct = Math.min((contribution / (WEIGHT_TOTAL * 0.2)) * 100, 100);
            let impactLabel, impactColor;
            if      (values[q.id] >= 80) { impactLabel = "Severe";       impactColor = "#C0392B"; }
            else if (values[q.id] >= 60) { impactLabel = "Significant";  impactColor = "#D35400"; }
            else if (values[q.id] >= 40) { impactLabel = "Moderate";     impactColor = "#CA8A04"; }
            else if (values[q.id] >= 20) { impactLabel = "Limited";      impactColor = "#16A34A"; }
            else                         { impactLabel = "Minimal";      impactColor = "#16A34A"; }
            return (
              <div key={q.id} style={{ marginBottom: 13 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
                  <span style={{ fontSize: 13, color: "#333", fontWeight: 500 }}>{q.heading}</span>
                  <span style={{ fontSize: 12, color: impactColor, fontWeight: 700 }}>{impactLabel}</span>
                </div>
                <div style={{ height: 6, borderRadius: 3, background: "#F0EDE8", overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${barPct}%`, background: q.color, borderRadius: 3, opacity: 0.7, transition: "width 0.35s ease" }} />
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ background: "#FFFFFF", border: "1px solid #E8E4DC", borderRadius: 6, padding: "24px", marginBottom: 36 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", color: "#888", textTransform: "uppercase", marginBottom: 14 }}>How this assessment works</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }} className="two-col">
            <p style={{ ...lora, fontSize: 13, color: "#666", lineHeight: 1.8, fontStyle: "italic" }}>
              Each dimension is weighted by its strategic ceiling, its maximum potential effect on a community bank's competitive position, capital adequacy, and franchise value. The score reflects the aggregate impact burden as a percentage of the maximum possible disruption across all eight dimensions. It is not a probability model. It assumes these forces materialize and asks only how severely.
            </p>
            <p style={{ ...lora, fontSize: 13, color: "#666", lineHeight: 1.8, fontStyle: "italic" }}>
              Where experienced people at the same institution disagree on the same inputs, that disagreement is more valuable than the score itself. The purpose is to surface where assumptions differ so strategic decisions are grounded in explicit beliefs rather than unexamined ones. Set your answers independently before comparing with colleagues.
            </p>
          </div>
        </div>

        <div style={{ borderTop: "1px solid #E8E4DC", paddingTop: 24, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }} className="two-col">
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", color: "#BBB", textTransform: "uppercase", marginBottom: 8 }}>Framework</div>
            <p style={{ ...lora, fontSize: 13, color: "#888", lineHeight: 1.8, fontStyle: "italic" }}>
              This framework is a sort of Drake Equation, originally used to estimate the number of communicating civilizations in the galaxy, applied to strategic planning. Rather than multiplying probabilities, it weights the assumed severity of known forces to produce a cumulative impact burden. The output is a prompt for conversation, not a prediction.
            </p>
          </div>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", color: "#BBB", textTransform: "uppercase", marginBottom: 8 }}>About This Tool</div>
            <p style={{ ...lora, fontSize: 13, color: "#888", lineHeight: 1.8, fontStyle: "italic" }}>
              Built as a practical planning tool for community bank leadership teams and boards. The base case inputs reflect an aggregated view of the community banking landscape as of early 2026. All inputs are adjustable to reflect your institution's market, portfolio composition, and competitive position.
            </p>
          </div>
        </div>

        <div style={{ textAlign: "center", marginTop: 36, fontSize: 10, color: "#CCC", letterSpacing: "0.15em", textTransform: "uppercase" }}>
          Community Banking Disruption Assessment · 2026 · Free to share and adapt
        </div>
      </div>
      )} {/* end tab conditional */}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
